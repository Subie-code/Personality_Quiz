<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cat Personality Quiz</title>

  <!-- Bootstrap helps style the page -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- My CSS file -->
  <link rel="stylesheet" href="css/style.css>

  <!-- The tab icon. This image must be in the img folder -->
  <link rel="icon" href="img/ideas.png">
</head>

<body>
  <main class="container py-4">
    <h1>What Kind of Cat Are You?</h1>

    <p>
      Are you a cozy, balanced, or curious cat?
      Pick one answer for each question.
    </p>

    <!-- Start quiz element -->
    <div class="question-block card p-3 mb-3">
      <h2 class="h5">1. How would you spend a free afternoon?</h2>

      <button
        type="button"
        class="answer-btn btn btn-outline-success mb-2"
        data-answer="1"
        aria-pressed="false"
      >
        Take a nap in a sunny spot
      </button>

      <button
        type="button"
        class="answer-btn btn btn-outline-success"
        data-answer="2"
        aria-pressed="false"
      >
        Explore and find something fun
      </button>
    </div>
    <!-- End quiz element -->

    <!-- Start quiz element -->
    <div class="question-block card p-3 mb-3">
      <h2 class="h5">2. You get a new toy. What do you do?</h2>

      <button
        type="button"
        class="answer-btn btn btn-outline-success mb-2"
        data-answer="1"
        aria-pressed="false"
      >
        Watch it from my comfy spot
      </button>

      <button
        type="button"
        class="answer-btn btn btn-outline-success"
        data-answer="2"
        aria-pressed="false"
      >
        Run over and play with it
      </button>
    </div>
    <!-- End quiz element -->

    <!-- Start quiz element -->
    <div class="question-block card p-3 mb-3">
      <h2 class="h5">3. What is your favorite place at home?</h2>

      <button
        type="button"
        class="answer-btn btn btn-outline-success mb-2"
        data-answer="1"
        aria-pressed="false"
      >
        A soft blanket on the couch
      </button>

      <button
        type="button"
        class="answer-btn btn btn-outline-success"
        data-answer="2"
        aria-pressed="false"
      >
        A window with lots to watch
      </button>
    </div>
    <!-- End quiz element -->

    <!-- Start quiz element -->
    <div class="question-block card p-3 mb-3">
      <h2 class="h5">4. How would your friends describe you?</h2>

      <button
        type="button"
        class="answer-btn btn btn-outline-success mb-2"
        data-answer="1"
        aria-pressed="false"
      >
        Calm and relaxed
      </button>

      <button
        type="button"
        class="answer-btn btn btn-outline-success"
        data-answer="2"
        aria-pressed="false"
      >
        Playful and curious
      </button>
    </div>
    <!-- End quiz element -->

    <button
      type="button"
      id="show-results"
      class="btn btn-success"
    >
      Show Results
    </button>

    <!-- JavaScript shows the result here -->
    <div id="result-container" class="mt-4" aria-live="polite"></div>
  </main>

  <!-- My JavaScript file -->
  <script src="js/script.js"></script>
</body>
</html>
